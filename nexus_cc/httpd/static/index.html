<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS Command Center</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0e13;color:#c9d1d9;font-family:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;font-size:13px;min-height:100vh}
a{color:#58a6ff;text-decoration:none}
#app{display:flex;min-height:100vh}
nav{width:210px;background:#0f141b;border-right:1px solid #1c232c;padding:14px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
nav .brand{color:#58a6ff;font-size:15px;letter-spacing:2px;font-weight:bold;padding:6px 10px 14px;border-bottom:1px solid #1c232c;margin-bottom:10px}
nav .brand small{display:block;color:#6e7681;font-size:10px;letter-spacing:1px;font-weight:normal;margin-top:4px}
nav .navlink{display:block;padding:7px 10px;margin:2px 0;color:#8b949e;border-left:3px solid transparent;font-size:12px;cursor:pointer;user-select:none}
nav .navlink:hover{color:#c9d1d9;background:#161b22}
nav .navlink.active{color:#58a6ff;border-left-color:#58a6ff;background:#161b22}
nav .navlink .dot{color:#30363d;margin-right:6px}
nav .navlink.active .dot{color:#58a6ff}
main{flex:1;padding:22px 26px;max-width:1400px;min-width:0}
h1.page-title{font-size:18px;letter-spacing:1.5px;color:#e6edf3;margin-bottom:2px;display:flex;align-items:center;gap:10px}
.page-sub{color:#6e7681;font-size:11px;margin-bottom:22px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.panel{background:#0f141b;border:1px solid #1c232c;border-radius:6px;overflow:hidden}
.panel-head{background:#11161d;padding:9px 14px;border-bottom:1px solid #1c232c;font-size:11px;color:#8b949e;letter-spacing:1px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.panel-body{padding:14px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:6px 10px;background:#11161d;color:#6e7681;font-size:10px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #1c232c}
td{padding:8px 10px;border-bottom:1px solid #161c24;vertical-align:top}
tr:hover td{background:#131a22}
.badge{font-size:10px;padding:1px 6px;border-radius:2px;background:#21262d;color:#8b949e;margin-right:4px;white-space:nowrap}
.badge.hl{background:#1f3a5f;color:#58a6ff}
.badge.warn{background:#3b2406;color:#d29922}
.badge.err{background:#441018;color:#f85149}
.status{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:bold;white-space:nowrap;letter-spacing:0.5px}
.s-created{background:#1f3a5f;color:#58a6ff}
.s-queued{background:#3b2406;color:#d29922}
.s-waiting_approval{background:#3b2406;color:#e3b341}
.s-running{background:#0f442d;color:#3fb950}
.s-done{background:#16241a;color:#3fb950}
.s-failed{background:#5a1a1a;color:#f85149}
.s-cancelled{background:#332c1e;color:#d29922}
.live{width:8px;height:8px;border-radius:50%;display:inline-block;animation:pulse 1.6s infinite}
.live.on{background:#3fb950}
.live.off{background:#f85149}
.live.wait{background:#d29922}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .n{font-size:24px;font-weight:bold;color:#e6edf3;letter-spacing:1px}
.stat .l{font-size:10px;color:#6e7681;text-transform:uppercase;letter-spacing:1px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:12px}
.kv dt{color:#6e7681}
.kv dd{color:#c9d1d9;word-break:break-all}
pre.code{background:#0b0e13;border:1px solid #1c232c;border-radius:4px;padding:10px;font-size:11px;overflow:auto;color:#7ee787;white-space:pre-wrap;word-break:break-word}
input,select,textarea{padding:6px 9px;background:#0b0e13;border:1px solid #21262d;color:#c9d1d9;font-family:inherit;font-size:12px;border-radius:3px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:#58a6ff}
label{font-size:10px;color:#6e7681;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:4px}
.btn{padding:6px 12px;background:#21262d;border:1px solid #30363d;color:#c9d1d9;font-family:inherit;font-size:12px;cursor:pointer;border-radius:3px}
.btn:hover{border-color:#58a6ff;color:#58a6ff}
.btn.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
.btn.primary:hover{background:#388bfd}
.btn.danger{border-color:#a13030}
.btn.danger:hover{border-color:#f85149;color:#f85149}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters .btn.active{background:#30363d;color:#58a6ff;border-color:#58a6ff}
.mono{font-family:inherit}
.muted{color:#6e7681}
.progress{height:6px;background:#161c24;border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:#3fb950}
#toast{position:fixed;bottom:20px;right:20px;padding:10px 16px;background:#11161d;border:1px solid #30363d;border-radius:6px;font-size:12px;display:none;z-index:1000;max-width:420px}
#toast.err{border-color:#f85149;color:#f85149}
#toast.ok{border-color:#3fb950;color:#3fb950}
.empty{padding:30px;text-align:center;color:#6e7681}
.hidden{display:none}
.right{text-align:right}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.p12{padding:12px}
.mt{margin-top:12px}
.mb{margin-bottom:12px}
.fs11{font-size:11px}
.fs10{font-size:10px}
.w50{width:50%}
.grow{flex:1}
tt{color:#7ee787}
.k{color:#ff7b72}
table.tight td{padding:6px 8px}
</style>
</head>
<body>
<div id="app">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
